<div class="cliente-container">

    <h1>Registro de Clientes</h1>

    <form>

        <!-- Sección para buscar un cliente existente y editarlo -->
        <div class="buscar-cliente">

            <!-- Título de la búsqueda -->
            <h3>Consultar Cliente</h3>

            <!-- Campo donde se escribe el ID del cliente -->
            <input
                type="number"
                [(ngModel)]="idBuscar"
                name="idBuscar"
                placeholder="Ingrese ID del cliente">

            <!-- Botón para buscar el cliente -->
            <button
                type="button"
                class="btn-buscar"
                (click)="buscarCliente()">
                Buscar
            </button>

        </div>

        <!-- Datos del cliente -->

        <label>Nombres</label>
        <input type="text" placeholder="Ingrese nombres">

        <label>Apellidos</label>
        <input type="text" placeholder="Ingrese apellidos">

        <label>DUI</label>
        <input type="text" placeholder="00000000-0">

        <label>Teléfono</label>
        <input type="text" placeholder="7777-7777">

        <label>Correo Electrónico</label>
        <input type="email" placeholder="correo@ejemplo.com">

        <label>Dirección</label>
        <textarea rows="3"></textarea>

        <!-- Este botón sirve para guardar un cliente nuevo -->
        <button type="submit">
            Guardar Cliente
        </button>

        <!-- Este botón servirá para actualizar un cliente encontrado -->
        <button
            type="button"
            class="btn-actualizar">
            Actualizar Cliente
        </button>

        <!-- Regresar al menú principal -->
        <a href="/inicio" class="btn-volver">
            Volver al Menú Principal
        </a>

    </form>

</div>
